<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>امتحان نهاية الفصل الدراسي</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fdf3d6}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}

body{margin:0}
*{box-sizing:border-box}
input,select,button{font-family:inherit}
option{color:#1f2937;background:#fff}
button{cursor:pointer;transition:transform .15s,filter .15s,box-shadow .15s}
button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(.93)}
button:disabled{opacity:.4;cursor:not-allowed}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid rgba(200,30,30,.5);outline-offset:3px}
.fld:focus{border-bottom-color:#c81e1e!important;border-bottom-style:solid!important}
.fld-light:focus{border-bottom-color:#fbbf24!important;border-bottom-style:solid!important}
input::placeholder{color:#78716c;font-weight:400}
.pulse{animation:pulse 1s infinite}
.blink{animation:blink 1s infinite}
@keyframes pulse{50%{opacity:.72}}
@keyframes blink{50%{background:#7f1d1d}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>

<div id="stage"><div id="root"></div></div>

        <button aria-label="ملء الشاشة" onClick="{{toggleFull}}" style="position: absolute; top: 18px; left: 18px; width: 46px; height: 46px; border-radius: 12px; border: 2px solid #d9d5cc; background: #fff; color: #4b5563; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>

        <div style="display: flex; align-items: center; gap: 12px; height: 72px; padding: 0 28px; border-radius: 20px; background: #1f2937; color: #fff; box-shadow: 0 6px 14px -4px rgba(0,0,0,.35)">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <span style="direction: ltr; font-weight: 800; font-size: 50px; font-variant-numeric: tabular-nums; line-height: 1">{{clockTime}}</span>

        </div>

<script>
(function () {
  var HOLE_TEST = /\{\{[^}]*\}\}/;
  var HOLE_G = /\{\{\s*([^}]*?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]*?)\s*\}\}\s*$/;
  var EVENTS = { onclick: 'click', onchange: 'change', oninput: 'input' };

  function get(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var v = scope, parts = path.split('.');
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE_G, function (m, p) {
      var v = get(p, scope);
      return v == null || v === false ? '' : String(v);
    });
  }
  function bindChildren(node) {
    return Array.prototype.slice.call(node.childNodes).map(bind).filter(Boolean);
  }
  function bind(node) {
    if (node.nodeType === 3) {
      if (!HOLE_TEST.test(node.data)) return null;
      var tpl = node.data;
      return function (s) { var t = interp(tpl, s); if (node.data !== t) node.data = t; };
    }
    if (node.nodeType !== 1) return null;
    var tag = node.tagName;

    if (tag === 'SC-FOR') {
      var listPath = WHOLE.exec(node.getAttribute('list') || '')[1];
      var as = node.getAttribute('as') || 'item';
      var proto = Array.prototype.slice.call(node.childNodes).map(function (n) { return n.cloneNode(true); });
      node.textContent = '';
      node.style.display = 'contents';
      var inst = [];
      return function (s) {
        var list = get(listPath, s) || [];
        while (inst.length < list.length) {
          var nodes = proto.map(function (n) { return n.cloneNode(true); });
          var binders = nodes.map(bind).filter(Boolean);
          nodes.forEach(function (n) { node.appendChild(n); });
          inst.push({ nodes: nodes, binders: binders });
        }
        while (inst.length > list.length) {
          inst.pop().nodes.forEach(function (n) { n.remove(); });
        }
        list.forEach(function (item, i) {
          var sc = Object.assign({}, s); sc[as] = item; sc.$index = i;
          inst[i].binders.forEach(function (b) { b(sc); });
        });
      };
    }

    if (tag === 'SC-IF') {
      var vp = WHOLE.exec(node.getAttribute('value') || '')[1];
      node.style.display = 'contents';
      var kidsIf = bindChildren(node);
      return function (s) {
        var v = !!get(vp, s);
        node.style.display = v ? 'contents' : 'none';
        if (v) kidsIf.forEach(function (b) { b(s); });
      };
    }

    var ups = [];
    Array.prototype.slice.call(node.attributes).forEach(function (a) {
      var name = a.name, val = a.value;
      if (name.indexOf('hint-') === 0) { node.removeAttribute(name); return; }
      if (!HOLE_TEST.test(val)) return;
      var lname = name.toLowerCase();
      var whole = WHOLE.exec(val);
      if (EVENTS[lname]) {
        var path = whole[1];
        node.removeAttribute(name);
        node.addEventListener(EVENTS[lname], function (e) {
          var h = get(path, node.__s);
          if (typeof h === 'function') h(e);
        });
        ups.push(function (s) { node.__s = s; });
        return;
      }
      node.removeAttribute(name);
      if (lname === 'value') {
        ups.push(function (s) {
          var v = whole ? get(whole[1], s) : interp(val, s);
          v = v == null ? '' : String(v);
          if (node.value !== v) node.value = v;
        });
      } else if (lname === 'disabled') {
        ups.push(function (s) { node.disabled = !!(whole ? get(whole[1], s) : interp(val, s)); });
      } else if (lname === 'class') {
        ups.push(function (s) { var v = interp(val, s); if (node.className !== v) node.className = v; });
      } else {
        ups.push(function (s) {
          var v = whole ? get(whole[1], s) : interp(val, s);
          if (lname.indexOf('aria-') === 0) v = String(v);
          if (v == null || v === false) { node.removeAttribute(name); return; }
          v = String(v);
          if (node.getAttribute(name) !== v) node.setAttribute(name, v);
        });
      }
    });
    var kids = bindChildren(node);
    if (!ups.length && !kids.length) return null;
    return function (s) {
      for (var i = 0; i < ups.length; i++) ups[i](s);
      for (var j = 0; j < kids.length; j++) kids[j](s);
    };
  }

  var current = null;
  window.DCLogic = class DCLogic {
    constructor(props) { this.props = props || {}; this.state = null; }
    setState(patch, cb) {
      this.state = Object.assign({}, this.state || {}, typeof patch === 'function' ? patch(this.state) : patch);
      if (current) current.render();
      if (cb) cb();
    }
    forceUpdate() { if (current) current.render(); }
  };

  window.DCMount = function (Component, tplEl, rootEl) {
    var comp = new Component({});
    rootEl.appendChild(tplEl.content.cloneNode(true));
    var binders = bindChildren(rootEl);
    current = {
      render: function () {
        var vals = comp.renderVals();
        for (var i = 0; i < binders.length; i++) binders[i](vals);
        if (comp.componentDidUpdate) comp.componentDidUpdate();
      }
    };
    current.render();
    if (comp.componentDidMount) comp.componentDidMount();
    return comp;
  };
})();

<script>

class Component extends DCLogic {
  blank() {
    return { committee: '', term: 'الأول', grades: [], subject: '', s1: '', s2: '10:30-11:30 صباحا', format: '', total: '', present: '' };
  }
  idleTimer() {
    return { status: 'idle', total: 3600, remaining: 3600, endAt: 0 };
  }
  getFields() {
    return { ...this.blank(), ...((this.state && this.state.fields) || {}) };
  }
  getTimer() {
    return (this.state && this.state.timer) || this.idleTimer();
  }
  getMinutesRaw() {
    const m = this.state && this.state.minutes;
    return m === undefined || m === null ? '60' : String(m);
  }
  minutesNum() {
    return Math.min(Math.max(parseInt(this.getMinutesRaw(), 10) || 60, 1), 600);
  }
  left(t) {
    return t.status === 'running' ? Math.max(0, Math.ceil((t.endAt - Date.now()) / 1000)) : t.remaining;
  }
  fmt(s) {
    const pad = (n) => String(n).padStart(2, '0');
    return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
  }
  persist() {
    try {
      localStorage.setItem(this._key, JSON.stringify({
        fields: this.state.fields, minutes: this.state.minutes, timer: this.state.timer
      }));
    } catch (e) {}
  }

  componentDidMount() {
    this._key = 'exam-display:' + new Date().toDateString();
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(this._key)) || {}; } catch (e) {}
    const patch = { now: Date.now() };
    if (saved.fields) patch.fields = saved.fields;
    if (saved.minutes !== undefined) patch.minutes = saved.minutes;
    if (saved.timer) {
      const t = saved.timer;
      patch.timer = (t.status === 'running' && this.left(t) <= 0) ? { ...t, status: 'done', remaining: 0 } : t;
    } else {
      const s = this.minutesNum() * 60;
      patch.timer = { status: 'idle', total: s, remaining: s, endAt: 0 };
    }
    this.setState(patch);
    this._iv = setInterval(() => this.tick(), 250);
  }
  componentWillUnmount() {
    clearInterval(this._iv);
  }
  componentDidUpdate() {
    try {
      const t = this.getTimer();
      document.title = t.status === 'idle' ? 'امتحان نهاية الفصل الدراسي' : this.fmt(this.left(t)) + ' - امتحان';
    } catch (e) {}
  }

  tick() {
    const t = this.getTimer();
    const s = this.left(t);
    if (t.status === 'running' && s <= 0) { this.finish(); return; }
    const key = t.status + ':' + s + ':' + new Date().getMinutes();
    if (key !== this._last) {
      this._last = key;
      this.setState({ now: Date.now() });
    }
  }
  unlockAudio() {
    try {
      this._audio = this._audio || new (window.AudioContext || window.webkitAudioContext)();
      if (this._audio.state === 'suspended') this._audio.resume();
    } catch (e) {}
  }
  beep(times) {
    try {
      this.unlockAudio();
      const a = this._audio;
      for (let i = 0; i < (times || 3); i++) {
        const o = a.createOscillator(), g = a.createGain(), at = a.currentTime + i * 0.6;
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.25, at);
        g.gain.exponentialRampToValueAtTime(0.001, at + 0.45);
        o.connect(g).connect(a.destination);
        o.start(at);
        o.stop(at + 0.5);
      }
    } catch (e) {}
  }
  finish() {
    if (this._fin) return;
    this._fin = true;
    const t = this.getTimer();
    this.setState({ timer: { ...t, status: 'done', remaining: 0 } }, () => { this.persist(); this.beep(3); });
  }
  start() {
    let t = this.getTimer();
    if (t.status === 'running') return;
    this._fin = false;
    const s = this.minutesNum() * 60;
    if (t.status === 'done') t = { status: 'idle', total: s, remaining: s, endAt: 0 };
    if (t.status === 'idle') t = { ...t, total: s, remaining: s };
    this.unlockAudio();
    this.setState({ timer: { ...t, status: 'running', endAt: Date.now() + t.remaining * 1000 } }, () => this.persist());
  }
  pause() {
    const t = this.getTimer();
    if (t.status !== 'running') return;
    this.setState({ timer: { ...t, status: 'paused', remaining: this.left(t) } }, () => this.persist());
  }
  reset() {
    this._fin = false;
    const s = this.minutesNum() * 60;
    this.setState({ timer: { status: 'idle', total: s, remaining: s, endAt: 0 } }, () => this.persist());
  }
  setMinutes(v) {
    const m = Math.min(Math.max(parseInt(v, 10) || 60, 1), 600);
    const t = this.getTimer();
    const patch = { minutes: String(v) };
    if (t.status === 'idle') patch.timer = { ...t, total: m * 60, remaining: m * 60 };
    this.setState(patch, () => this.persist());
  }
  setField(k, v) {
    this.setState({ fields: { ...this.getFields(), [k]: v } }, () => this.persist());
  }
  toggleFull() {
    try {
      let p;
      if (document.fullscreenElement) p = document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) p = document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  gradesAll() {
    return ['الثالث', 'الرابع', 'الخامس', 'السادس', 'السابع', 'الثامن', 'التاسع', 'العاشر', 'الحادي عشر'];
  }
  curGrades() {
    const f = this.getFields();
    return this.gradesAll().filter((g) => (f.grades || []).indexOf(g) >= 0);
  }
  cheer(elapsed) {
    const L = ['ركّز وثق بنفسك', 'أنت قادر على ذلك', 'اقرأ السؤال جيدًا', 'بالتوفيق والنجاح', 'توكّل على الله وأجب', 'النجاح ثمرة الاجتهاد', 'خذ نفسًا عميقًا وكمّل', 'راجع إجاباتك بتأنٍّ'];
    return L[Math.floor(Math.max(0, elapsed) / 30) % L.length];
  }
  durText(m) {
    const unit = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : (n >= 3 && n <= 10) ? n + ' ' + few : n + ' ' + many;
    const h = Math.floor(m / 60), r = m % 60;
    if (h === 0) return unit(r, 'دقيقة واحدة', 'دقيقتان', 'دقائق', 'دقيقة');
    const hs = unit(h, 'ساعة واحدة', 'ساعتان', 'ساعات', 'ساعة');
    if (r === 0) return hs;
    if (r === 30) return (h === 1 ? 'ساعة' : hs) + ' ونصف';
    if (r === 15) return (h === 1 ? 'ساعة' : hs) + ' وربع';
    return hs + ' و' + unit(r, 'دقيقة واحدة', 'دقيقتان', 'دقائق', 'دقيقة');
  }

  renderVals() {
    const t = this.getTimer();
    const s = this.left(t);
    const f = this.getFields();

    const done = t.status === 'done';
    const idle = t.status === 'idle';
    const running = t.status === 'running';
    const warn = !idle && !done && s > 0 && s <= 300;
    const pct = t.total ? Math.max(0, Math.min(100, (s / t.total) * 100)) : 0;
    const accent = warn ? '#d97706' : '#15803d';

    const statusText = {
      idle: 'جاهز للبدء',
      running: warn ? 'تبقّى 5 دقائق أو أقل' : this.cheer(t.total - s),
      paused: 'متوقف مؤقتاً',
      done: 'انتهى الوقت'
    }[t.status];

    const sel = this.minutesNum();
    const presets = [60, 90, 120].map((p) => ({
      label: String(p),
      bg: p === sel ? '#1f2937' : '#fff',
      fg: p === sel ? '#fff' : '#1f2937',
      border: p === sel ? '#1f2937' : '#d9d5cc',
      pick: () => { if (this.getTimer().status === 'idle') this.setMinutes(String(p)); }
    }));

    const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
    const now = new Date();

    const tn = parseInt(f.total, 10), pn = parseInt(f.present, 10);
    const absent = (tn > 0 && !isNaN(pn)) ? Math.max(tn - pn, 0) : '';
    const over = !isNaN(tn) && !isNaN(pn) && pn > tn;

    const bind = (k) => (e) => this.setField(k, e.target.value);

    const chosen = this.curGrades();
    const gradeText = chosen.length ? chosen.join(' - ') : 'اختر الصف';
    const INK = '#1f2937';
    const gradeItems = this.gradesAll().map((g) => {
      const on = chosen.indexOf(g) >= 0;
      return {
        label: g, on: on,
        bg: on ? INK : '#fff', fg: on ? '#fff' : INK, border: on ? INK : '#d9d5cc',
        toggle: () => {
          const cur = this.curGrades();
          this.setField('grades', cur.indexOf(g) >= 0 ? cur.filter((x) => x !== g) : cur.concat([g]));
        }
      };
    });

    return {
      f,
      on: {
        committee: bind('committee'), term: bind('term'), grade: bind('grade'), subject: bind('subject'),
        s1: bind('s1'), s2: bind('s2'), format: bind('format'),
        total: bind('total'), present: bind('present')
      },
      digits: this.fmt(s),
      totalLabel: 'المدة: ' + Math.round(t.total / 60) + ' دقيقة',
      durationText: this.durText(Math.max(1, Math.round(t.total / 60))),
      s2Color: f.s2 === 'none' ? '#78716c' : '#000',
      gradeText,
      gradeItems,
      gradeColor: chosen.length ? '#000' : '#78716c',
      gradeFont: Math.max(20, Math.min(38, Math.floor(400 / gradeText.length))) + 'px',
      gradeOpen: !!(this.state && this.state.gradeOpen),
      toggleGrade: () => this.setState({ gradeOpen: !(this.state && this.state.gradeOpen) }),
      clearGrades: () => this.setField('grades', []),
      yearText: (() => { const d = new Date(), y = d.getFullYear(); return d.getMonth() >= 7 ? y + '-' + (y + 1) : (y - 1) + '-' + y; })(),
      ringBg: done ? '#9f1239' : 'conic-gradient(' + accent + ' ' + (pct * 3.6).toFixed(2) + 'deg, #eee8da 0)',
      innerBg: done ? '#c81e1e' : '#ffffff',
      digitColor: done ? '#ffffff' : (warn ? '#c81e1e' : '#1f2937'),
      subColor: done ? 'rgba(255,255,255,.92)' : '#4b5563',
      statusText,
      statusColor: (warn || done) ? '#b91c1c' : '#4b5563',
      ringClass: (running && warn) ? 'pulse' : '',
      innerClass: done ? 'blink' : '',
      presets,
      presetsDisabled: !idle,
      minutes: this.getMinutesRaw(),
      minutesDisabled: !idle,
      onMinutes: (e) => { if (this.getTimer().status === 'idle') this.setMinutes(e.target.value); },
      startLabel: t.status === 'paused' ? 'استئناف' : 'ابدأ',
      startDisabled: running,
      pauseDisabled: !running,
      start: () => this.start(),
      pause: () => this.pause(),
      reset: () => this.reset(),
      toggleFull: () => this.toggleFull(),
      dayName: DAYS[now.getDay()],
      dateText: now.getDate() + '/' + (now.getMonth() + 1) + '/' + now.getFullYear(),
      clockTime: (now.getHours() % 12 || 12) + ':' + String(now.getMinutes()).padStart(2, '0'),
      clockAmPm: now.getHours() < 12 ? 'ص' : 'م',
      absentText: absent === '' ? '' : String(absent),
      presentBg: over ? '#fee2e2' : '#ecfdf3',
      presentBorder: over ? '#c81e1e' : '#b7e4c7',
      presentInvalid: over ? 'true' : 'false'
    };
  }
}

(function () {
  DCMount(Component, document.getElementById('tpl'), document.getElementById('root'));
  var stage = document.getElementById('stage');
  function fit() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    var ox = (innerWidth - 1920 * s) / 2, oy = (innerHeight - 1080 * s) / 2;
    stage.style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
